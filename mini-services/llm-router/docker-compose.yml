version: "3.9"

services:
  llm-router:
    build: .
    container_name: llm-router
    ports:
      - "7200:7200"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=7200
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llm_router
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - RATE_LIMITER_URL=http://rate-limiter:7102
      - OTLP_ENDPOINT=http://otel-collector:4318
      - ENABLE_TRACING=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jk-tech-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"

  postgres:
    image: postgres:16-alpine
    container_name: llm-router-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llm_router
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jk-tech-net

  redis:
    image: redis:7-alpine
    container_name: llm-router-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - jk-tech-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    container_name: llm-router-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"
    restart: unless-stopped
    networks:
      - jk-tech-net

volumes:
  postgres_data:
  redis_data:

networks:
  jk-tech-net:
    external: true
    name: jk-tech-net
